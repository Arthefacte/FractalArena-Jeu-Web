<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Totem — Prototype cinématique</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family:monospace; }
  #stage { position:fixed; inset:0; background:#000; }
  canvas { display:block; }
  /* flash blanc-bleu plein cadre */
  #flash { position:fixed; inset:0; background:radial-gradient(circle at 50% 50%, #ffffff 0%, #cfe9ff 35%, #6fb7ff 60%, rgba(0,0,0,0) 80%);
           opacity:0; pointer-events:none; z-index:20; }
  /* image révélée (stand-in du Totem) */
  #reveal { position:fixed; inset:0; display:grid; place-items:center; opacity:0; pointer-events:none; z-index:15; transition:opacity .9s ease, transform .9s ease; transform:scale(.85); }
  #reveal img { max-width:min(42vw,42vh); max-height:min(42vw,42vh); border-radius:14px;
                box-shadow:0 0 40px rgba(0,240,255,.35), 0 0 80px rgba(247,147,26,.2); }
  #ui { position:fixed; left:0; right:0; bottom:18px; text-align:center; z-index:30; color:#9fb4d8; font-size:12px; letter-spacing:1px; }
  #ui button { font-family:monospace; background:#0a1326; color:#cfe1ff; border:1px solid #25406e; padding:9px 16px; border-radius:8px; cursor:pointer; letter-spacing:1px; }
  #ui button:hover { background:#12203c; }
  #hint { margin-top:8px; opacity:.7; }
  #err { position:fixed; inset:0; display:none; place-items:center; color:#ff8080; z-index:40; padding:20px; text-align:center; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="flash"></div>
<div id="reveal"><img id="revealImg" src="assets/HASHBYTE.webp" alt="" /></div>
<div id="err"></div>
<div id="ui">
  <button id="replay">▶ Rejouer l'invocation</button>
  <label style="margin-left:14px;"><input type="checkbox" id="inspect" /> inspecter (souris)</label>
  <div id="hint">médaillon = ton jeton.glb · image révélée = stand-in (HASHBYTE.webp)</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const stage = document.getElementById('stage');
const flashEl = document.getElementById('flash');
const revealEl = document.getElementById('reveal');
const errEl = document.getElementById('err');

function showErr(m){ errEl.style.display='grid'; errEl.textContent = 'Erreur : ' + m; }

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 6);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

scene.add(new THREE.AmbientLight(0x404858, 0.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3,4,5); scene.add(key);
const orange = new THREE.PointLight(0xff7a1a, 60, 30); orange.position.set(-4,-1,3); scene.add(orange);
const cyan = new THREE.PointLight(0x00f0ff, 60, 30); cyan.position.set(4,2,2); scene.add(cyan);

const pivot = new THREE.Group();
scene.add(pivot);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enabled = false; controls.enablePan = false;
document.getElementById('inspect').addEventListener('change', e => { controls.enabled = e.target.checked; });

// aberration chromatique maison (vendor/minified : pas de RGBShiftShader partout)
const ChromaticAberrationShader = {
  uniforms: { tDiffuse: { value: null }, amount: { value: 0.0 }, uCenter: { value: new THREE.Vector2(0.5, 0.5) } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float amount; uniform vec2 uCenter; varying vec2 vUv;
    void main() {
      vec2 dir = vUv - uCenter; vec2 off = dir * amount;
      float r = texture2D(tDiffuse, vUv - off).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv + off).b;
      gl_FragColor = vec4(r, g, b, 1.0);
    }`,
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.6, 0.85);
composer.addPass(bloom);
const caPass = new ShaderPass(ChromaticAberrationShader);
composer.addPass(caPass);
composer.addPass(new OutputPass());

// étincelles en tourbillon
const SPARK_N = 240;
const sparkPos = new Float32Array(SPARK_N * 3);
const sparkCol = new Float32Array(SPARK_N * 3);
const sparkVel = [];
const _cO = new THREE.Color(0xff8a2a), _cC = new THREE.Color(0x46e6ff);
function seedSpark(i){
  const r = 0.15 + Math.random() * 0.35;
  const a = Math.random() * Math.PI * 2, b = (Math.random() - 0.5) * Math.PI;
  sparkPos[i*3]   = Math.cos(a)*Math.cos(b)*r;
  sparkPos[i*3+1] = Math.sin(b)*r;
  sparkPos[i*3+2] = Math.sin(a)*Math.cos(b)*r;
  const sp = 0.5 + Math.random() * 1.3;
  sparkVel[i] = new THREE.Vector3((Math.random()-0.5), (Math.random()*0.7+0.15), (Math.random()-0.5)).normalize().multiplyScalar(sp);
  const c = Math.random() < 0.5 ? _cO : _cC;
  sparkCol[i*3] = c.r; sparkCol[i*3+1] = c.g; sparkCol[i*3+2] = c.b;
}
for (let i = 0; i < SPARK_N; i++) seedSpark(i);
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));
const sparkMat = new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.Points(sparkGeo, sparkMat));

// onde de choc : anneau qui éclate au flash
const ringGeo = new THREE.TorusGeometry(1, 0.02, 16, 80);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false });
const ring = new THREE.Mesh(ringGeo, ringMat); ring.renderOrder = 999; scene.add(ring);

let energy = 0;
function applyEnergy(e){
  energy = e;
  bloom.strength   = 0.10 + 2.6 * e;
  orange.intensity = 5 + 70 * e;
  cyan.intensity   = 5 + 70 * e;
  sparkMat.opacity = Math.min(1, e * 1.25);
  sparkMat.size    = 0.03 + 0.05 * e;
  caPass.uniforms.amount.value = e > 0.3 ? (e - 0.3) * 0.008 : 0;
}

let model = null;
const loader = new GLTFLoader();
loader.load('assets/jeton.glb', (gltf) => {
  const root = gltf.scene; // MATÉRIAU 100% D'ORIGINE (Meshy)
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const scale = 2.6 / maxDim;
  root.position.sub(center);
  const wrap = new THREE.Group(); wrap.add(root); wrap.scale.setScalar(scale);
  pivot.add(wrap);
  model = pivot;
  play();
}, undefined, (e) => showErr('chargement GLB : ' + (e?.message || e)));

let t0 = null, raf = null, phase = 'idle', windT0 = 0, spinT0 = 0, lastNow = 0, ringT0 = 0;
const INTRO_DUR = 1.5, WIND_DUR = 4.5, WIND_TURNS = 3, SPIN_DUR = 2.8, CAM_FAR = 9.5, CAM_NEAR = 5.6;
const easeOut = x => 1 - Math.pow(1 - x, 3);

function setCam(z){ if (!controls.enabled){ camera.position.set(0, 0, z); camera.lookAt(0, 0, 0); } }
function play(){
  flashEl.style.transition = 'none'; flashEl.style.opacity = 0;
  revealEl.style.opacity = 0; revealEl.style.transform = 'scale(.85)';
  pivot.rotation.y = 0; renderer.toneMappingExposure = 0.08; setCam(CAM_FAR);
  ringT0 = 0; ringMat.opacity = 0; ring.scale.setScalar(0.2);
  applyEnergy(0.04); t0 = performance.now(); lastNow = t0; phase = 'intro';
}
function triggerFlash(){
  flashEl.style.transition = 'opacity .18s ease-out';
  flashEl.style.opacity = 1;
  ring.scale.setScalar(0.2); ringMat.opacity = 0.9; ringT0 = performance.now();
  for (let i = 0; i < SPARK_N; i++) seedSpark(i); // bouffée d'étincelles
  setTimeout(() => {
    revealEl.style.opacity = 1; revealEl.style.transform = 'scale(1)';
    flashEl.style.transition = 'opacity .8s ease-in'; flashEl.style.opacity = 0;
    bloom.strength = 0.7; phase = 'settle';
  }, 200);
}
function frame(now){
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - (lastNow || now)) / 1000); lastNow = now;
  controls.update();
  // étincelles : dérive + tourbillon + aspiration (scalés par l'énergie)
  for (let i = 0; i < SPARK_N; i++){
    const ix = i * 3;
    sparkPos[ix]   += sparkVel[i].x * dt;
    sparkPos[ix+1] += sparkVel[i].y * dt;
    sparkPos[ix+2] += sparkVel[i].z * dt;
    const sx = sparkPos[ix], sz = sparkPos[ix+2];
    const rXZ = Math.hypot(sx, sz) + 1e-4;
    const swirl = (0.5 + 3.5 * energy) * dt;
    sparkPos[ix]   += (-sz / rXZ) * swirl;
    sparkPos[ix+2] += ( sx / rXZ) * swirl;
    const pull = 1.2 * energy * dt;
    sparkPos[ix]   -= (sx / rXZ) * pull;
    sparkPos[ix+2] -= (sz / rXZ) * pull;
    if (Math.hypot(sparkPos[ix], sparkPos[ix+1], sparkPos[ix+2]) > 2.6) seedSpark(i);
  }
  sparkGeo.attributes.position.needsUpdate = true;
  // onde de choc : expansion + fondu
  if (ringT0) {
    const t = (now - ringT0) / 1000;
    if (t >= 0.7) { ringT0 = 0; ringMat.opacity = 0; }
    else { ring.scale.setScalar(0.2 + t * 6); ringMat.opacity = 0.9 * (1 - t / 0.7); }
  }
  if (model && phase === 'intro'){
    const k = Math.min((now - t0) / 1000 / INTRO_DUR, 1), e = easeOut(k);
    setCam(CAM_FAR + (CAM_NEAR - CAM_FAR) * e);
    renderer.toneMappingExposure = 0.08 + (1.15 - 0.08) * e;
    pivot.rotation.y = 0.15 * e;
    applyEnergy(0.04 + 0.04 * e);
    if (k >= 1){ phase = 'wind'; windT0 = now; }
  } else if (model && phase === 'wind'){
    const t = (now - windT0) / 1000, k = Math.min(t / WIND_DUR, 1);
    pivot.rotation.y = 0.15 + WIND_TURNS * Math.PI * 2 * k; // quelques tours complets avant l'accélération
    if (!controls.enabled) { camera.position.x = Math.sin((t / WIND_DUR) * Math.PI * 2) * 0.5; camera.position.y = Math.sin((t / WIND_DUR) * Math.PI * 4) * 0.25; camera.lookAt(0,0,0); }
    applyEnergy(0.08 + 0.20 * (t / WIND_DUR));
    if (t >= WIND_DUR){ phase = 'spin'; spinT0 = now; }
  } else if (model && phase === 'spin'){
    const t = (now - spinT0) / 1000, k = Math.min(t / SPIN_DUR, 1);
    pivot.rotation.y += (WIND_TURNS * Math.PI * 2 / WIND_DUR + 20 * (k*k)) * dt; // continue la vitesse du wind puis accélère
    if (!controls.enabled) { camera.position.x = (Math.random()-0.5) * 0.06 * (k*k); camera.position.y = (Math.random()-0.5) * 0.06 * (k*k); camera.position.z = CAM_NEAR - 0.6 * k; camera.lookAt(0,0,0); }
    applyEnergy(0.28 + 0.72 * (k*k));
    if (t >= SPIN_DUR){ phase = 'flash'; triggerFlash(); }
  } else if (model && phase === 'settle'){
    pivot.rotation.y += (WIND_TURNS * Math.PI * 2 / WIND_DUR) * dt; // retour à la vitesse lente de début
    if (!controls.enabled) { camera.position.x += (0 - camera.position.x) * 0.08; camera.position.y += (0 - camera.position.y) * 0.08; camera.position.z += (CAM_NEAR - camera.position.z) * 0.06; camera.lookAt(0,0,0); }
    applyEnergy(0.12);
  }
  composer.render();
}
requestAnimationFrame(frame);

document.getElementById('replay').addEventListener('click', play);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
