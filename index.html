<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#05070f" />
  <title>Fractal Arena</title>
  <link rel="icon" type="image/png" href="assets/favicon.png?v=1" />
  <link rel="stylesheet" href="styles.css?v=44" />
  <link rel="stylesheet" href="mobile.css?v=44" />
  <!-- Three.js pour l'emblème 3D de la cinématique d'ouverture (import() dynamique dans cinematique.jsx) -->
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <style>
    /* Cinématique d'ouverture — keyframes & classes (cinematique.jsx) */
    @keyframes cineRise {
      0% { transform: translateY(0) translateX(0) scale(1); opacity:0; }
      14% { opacity:1; }
      100% { transform: translateY(-110vh) translateX(var(--drift,20px)) scale(0.2); opacity:0; }
    }
    @keyframes ctaPulse { 0%,100% { box-shadow: 0 0 18px 0 var(--cta); } 50% { box-shadow: 0 0 42px 7px var(--cta); } }
    @keyframes accentShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .title-shift { animation: accentShift 5s linear infinite; }
    @keyframes glowHue { 0% { filter: blur(14px) hue-rotate(0deg); } 50% { filter: blur(14px) hue-rotate(-150deg); } 100% { filter: blur(14px) hue-rotate(0deg); } }
    .glow-shift { animation: glowHue 5s ease-in-out infinite; }
    @keyframes ctaHue { 0% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(-150deg); } 100% { filter: hue-rotate(0deg); } }
  </style>
  <style>
    :root { --filigrane: url('assets/BACKGROUND.png'); }
    @keyframes obFloat { 0%,100% { transform: translateY(-6px); } 50% { transform: translateY(6px); } }
    @keyframes obPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(247,147,26,0.35)) drop-shadow(0 0 22px rgba(0,240,255,0.18)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 28px rgba(247,147,26,0.6)) drop-shadow(0 0 44px rgba(0,240,255,0.4)); }
    }
    @keyframes obHalo { 0%,100% { transform: scale(0.92); } 50% { transform: scale(1.06); } }
    @keyframes obSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #05070f; z-index: 999; }
    #boot .b { font-family: 'JetBrains Mono', monospace; color: #00F0FF; letter-spacing: 4px; font-size: 13px; animation: bootPulse 1.1s ease-in-out infinite; }
    @keyframes bootPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  </style>
</head>

<body>
  <div id="root"></div>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#05070f"/>
      <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="#F7931A" stroke-width="3"/>
      <polygon points="50,30 66,39 66,61 50,70 34,61 34,39" fill="none" stroke="#00F0FF" stroke-width="2"/>
      <text x="50" y="57" font-family="monospace" font-size="20" font-weight="700" fill="#EAF1FF" text-anchor="middle">FA</text>
    </svg>
  </template>
  <div id="boot"><div class="b">FRACTAL ARENA · BOOTING</div></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- plain JS data/logic -->
  <!-- Cache-busting : incrémenter ?v=X à chaque déploiement pour forcer le rechargement -->
  <script src="data.js?v=44"></script>
  <script src="i18n.js?v=44"></script>
  <script src="engine.js?v=44"></script>
  <script src="cosmetic.js?v=44"></script>
  <script src="loop.js?v=44"></script>
  <script src="arene-ui.js?v=44"></script>
  <script src="forge-ui.js?v=44"></script>
  <script src="totem-ui.js?v=44"></script>
  <script type="module" src="totem-cine.js?v=44"></script>

  <!-- React (Babel) — order matters: components → screens → chat/room → app -->
  <script type="text/babel" src="components.jsx?v=44"></script>
  <script type="text/babel" src="cinematique.jsx?v=44"></script>
  <script type="text/babel" src="fosse.jsx?v=44"></script>
  <script type="text/babel" src="arene.jsx?v=44"></script>
  <script type="text/babel" src="screens.jsx?v=44"></script>
  <script type="text/babel" src="chat.jsx?v=44"></script>
  <script type="text/babel" src="roomchat.jsx?v=44"></script>
  <script type="text/babel" src="leaderboard.jsx?v=44"></script>
  <script type="text/babel" src="quests.jsx?v=44"></script>
  <script type="text/babel" src="login.jsx?v=44"></script>
  <script type="text/babel" src="tutorial.jsx?v=44"></script>
  <script type="text/babel" src="campaign.jsx?v=44"></script>
  <script type="text/babel" src="buyback.jsx?v=44"></script>
  <script type="text/babel" src="link.jsx?v=44"></script>
  <script type="text/babel" src="app.jsx?v=44"></script>

  <script>
    // hide boot splash once React has mounted
    (function () {
      var tries = 0;
      var iv = setInterval(function () {
        tries++;
        var root = document.getElementById('root');
        if (root && root.children.length) { var b = document.getElementById('boot'); if (b) b.remove(); clearInterval(iv); }
        if (tries > 80) clearInterval(iv);
      }, 80);
    })();
  </script>
</body>

</html>
