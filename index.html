  <!-- Content-Security-Policy (défense en profondeur). 'unsafe-eval' A ÉTÉ RETIRÉ : il
       était dû à Babel-in-browser, puis au seul `new Function` de cinematique.jsx qui
       masquait l'import dynamique de Three.js. Les .jsx sont pré-transpilés (build/) et
       l'import() y est écrit tel quel — plus rien ne construit de code depuis une chaîne,
       un test le vérifie sur tous les fichiers servis. En revanche 'wasm-unsafe-eval' EST
       nécessaire : le décodeur meshopt des .glb de reliques (relic-models.js) instancie un
       module WebAssembly, que la CSP bloquait silencieusement — les reliques retombaient sur
       leur rendu primitif. Cette directive-là n'autorise QUE WebAssembly, pas eval() ni
       new Function. Reste 'unsafe-inline' pour les
       scripts inline de boot ; React/ReactDOM via unpkg (protégés par SRI, cf. scripts en
       bas) ; Three.js AUTO-HÉBERGÉ (vendor/, plus d'unpkg pour lui).
       connect-src verrouillé sur l'API Railway (seul hôte appelé) : même une lib CDN compromise
       ne pourrait pas exfiltrer le token sessionStorage vers un tiers. blob:/data: pour les
       textures GLB et les vignettes canvas des reliques. Google Fonts (@import styles.css) exige
       fonts.googleapis.com en style-src + fonts.gstatic.com en font-src ; l'art des totems
       upgradés est servi depuis le bucket R2 (img-src) : domaine managé pub-*.r2.dev
       + l'ancien domaine perso totems.fractalarena.com conservé si un jour rebranché. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-nP7Lf5D3tIw8pykmO5oG0PnwhHWbac+axwKm7G4pR1g=' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://totems.fractalarena.com https://pub-0b140013c6564ee080397bcdb722b776.r2.dev; font-src 'self' data: https://fonts.gstatic.com; media-src 'self'; connect-src 'self' https://fractal-arena-server-production.up.railway.app blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" />
  <!-- Anti-clickjacking. `frame-ancestors` est declare plus haut mais les navigateurs
       IGNORENT cette directive quand elle vient d'un <meta>, et GitHub Pages ne permet pas
       d'ajouter un en-tete HTTP : la protection est donc ce script, charge avant tout
       affichage. -->
  <script src="frame-guard.js?v=245"></script>
  <title>Fractal Arena</title>
  <link rel="icon" type="image/png" href="assets/favicon.png?v=245" />
  <!-- PWA : le manifeste rend le jeu installable (écran d'accueil, plein écran).
       iOS ignore le manifeste pour l'icône et le mode plein écran, d'où les trois
       balises apple-* qui doublent l'information. Icônes fabriquées depuis
       l'emblème réel par _bake/gen-pwa-icons.mjs (dont une « maskable » réduite
       à 72 %, qu'Android insère dans son propre gabarit sans couper les pointes). -->
  <link rel="manifest" href="manifest.webmanifest?v=245" />
  <link rel="apple-touch-icon" href="assets/pwa/apple-touch-icon-180.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Three.js AUTO-HÉBERGÉ (0.160.0) : cœur + clôture transitive des addons vendorisés sous
       vendor/three-0.160.0/. Élimine la dépendance CDN tierce non protégeable par SRI (les
       importmaps ne supportent pas l'intégrité). Le dossier versionné sert de cache-bust. -->
  <script type="importmap">{ "imports": { "three": "./vendor/three-0.160.0/three.module.js", "three/addons/": "./vendor/three-0.160.0/addons/" } }</script>
  <style>
    /* Cinématique d'ouverture — keyframes & classes (cinematique.jsx) */
    @keyframes cineRise {
      0% { transform: translateY(0) translateX(0) scale(1); opacity:0; }
      14% { opacity:1; }
      100% { transform: translateY(-110vh) translateX(var(--drift,20px)) scale(0.2); opacity:0; }
    }
    @keyframes ctaPulse { 0%,100% { box-shadow: 0 0 18px 0 var(--cta); } 50% { box-shadow: 0 0 42px 7px var(--cta); } }
    @keyframes accentShift { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
    .title-shift { animation: accentShift 5s linear infinite; }
    /* hue-rotate seul : le blur(14px) qui figurait ici forçait une convolution sur 820x820 px à
       chaque frame, pendant que l'emblème 3D tourne. Sur un radial-gradient — déjà lisse par
       construction — il ne produisait aucune différence visible (comparaison faite). */
    @keyframes glowHue { 0% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(-150deg); } 100% { filter: hue-rotate(0deg); } }
    .glow-shift { animation: glowHue 5s ease-in-out infinite; }
    @keyframes ctaHue { 0% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(-150deg); } 100% { filter: hue-rotate(0deg); } }
  </style>
  <style>
    :root { --filigrane: url('assets/BACKGROUND.webp'); }
    @keyframes obFloat { 0%,100% { transform: translateY(-6px); } 50% { transform: translateY(6px); } }
    @keyframes obHalo { 0%,100% { transform: scale(0.92); } 50% { transform: scale(1.06); } }
    @keyframes obSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    /* Boot #5 — chargement de marque : l'emblème s'assemble en 3D (frames dans assets/boot-anim.js) */
    #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 999;
      background:
        radial-gradient(900px 620px at 50% 42%, rgba(0,240,255,.05), transparent 60%),
        radial-gradient(700px 560px at 50% 108%, rgba(247,147,26,.06), transparent 55%),
        #05070f; }
    #boot .boot-in { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    #boot .emb-wrap { position: relative; width: 200px; height: 200px; }
    #boot .halo { position: absolute; inset: -24%; border-radius: 50%;
      background: radial-gradient(circle at 50% 48%, rgba(0,240,255,.28), rgba(247,147,26,.10) 44%, transparent 66%);
      filter: blur(10px); opacity: 0; transition: opacity .5s; }
    #boot #boot-emblem { position: absolute; inset: 0; width: 100%; height: 100%; }
    #boot .flash { position: absolute; inset: -40%; pointer-events: none; opacity: 0;
      background: radial-gradient(circle, rgba(180,250,255,.9), rgba(0,240,255,.22) 34%, transparent 62%); }
    #boot .bword { font-family: 'Chakra Petch', sans-serif; font-weight: 700; letter-spacing: .42em; font-size: 20px; padding-left: .42em;
      background: linear-gradient(90deg, #F7931A, #fff 52%, #00F0FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #boot .bhash { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; letter-spacing: .14em; color: #7F8DAD; height: 15px; display: flex; gap: 9px; }
    #boot .bhash .tag { color: #00F0FF; } #boot .bhash .hx { color: #9fb4d6; }
    #boot.settled .halo { opacity: .7; }
    #boot.settled .emb-wrap { animation: bootFloat 4.2s ease-in-out infinite; }
    #boot.settled .flash { animation: bootFlash .5s ease-out; }
    @keyframes bootFloat { 0%,100% { transform: translateY(-4px); } 50% { transform: translateY(4px); } }
    @keyframes bootFlash { 0% { opacity: 0; } 40% { opacity: .85; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #boot.settled .emb-wrap, #boot.settled .flash { animation: none; } }
  </style>
</head>
