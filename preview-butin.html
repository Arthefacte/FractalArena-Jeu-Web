<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu butin — fragments</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { background:#080d18; margin:0; padding:18px; }
  .apercu { max-width: 380px; margin: 0 auto; display:flex; flex-direction:column; gap:12px; }
  .apercu h3 { font-size: 11px; letter-spacing: 2px; color:#7f8dad; margin: 0 0 2px; font-family: "Segoe UI", sans-serif; }
</style>
</head>
<body>
  <div class="apercu">
    <div>
      <div class="eyebrow" style="font-size:10px;color:var(--fire)">FOSSE DES ÉCHOS</div>
      <b style="font-size:20px">Butin récolté</b>
    </div>

    <!-- Le panneau tel qu'il est rendu dans expeditions.jsx -->
    <div class="panel" style="padding:0;overflow:hidden">
      <img src="assets/relic-shard-banner.webp" alt="" style="display:block;width:100%;height:108px;object-fit:cover">
      <div style="padding:12px 13px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="exq-hex" style="color:#9aa7bd;border-color:#9aa7bd;background:rgba(255,255,255,.04);padding:0;overflow:hidden">
              <img src="assets/relic-shard.webp" alt="" style="display:block;width:100%;height:100%;object-fit:cover">
            </span>
            <b style="flex:1;min-width:0;font-size:13px">Fragments C ×2</b>
            <b class="exq-mono" style="color:#9aa7bd">2 / 3</b>
          </div>
          <div class="bar xp"><i style="width:66%"></i></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="exq-hex" style="color:#ffd166;border-color:#ffd166;background:rgba(255,255,255,.04);padding:0;overflow:hidden">
              <img src="assets/relic-shard.webp" alt="" style="display:block;width:100%;height:100%;object-fit:cover">
            </span>
            <b style="flex:1;min-width:0;font-size:13px">Fragments A ×1</b>
            <b class="exq-mono" style="color:#ffd166">1 / 5</b>
          </div>
          <div class="bar xp"><i style="width:20%"></i></div>
        </div>
      </div>
    </div>

    <!-- Le panneau tel qu'il est rendu dans expeditions.jsx — FRAGMENTS DE CORE
         (mirroir du panneau relique au-dessus, depuis le 24/10) -->
    <div class="panel" style="padding:0;overflow:hidden">
      <img src="assets/core-shard-banner.webp?v=406" alt="" style="display:block;width:100%;height:108px;object-fit:cover">
      <div style="padding:12px 13px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="exq-hex" style="color:#9aa7bd;border-color:#9aa7bd;background:rgba(255,255,255,.04);padding:0;overflow:hidden">
              <img src="assets/core-shard.webp?v=406" alt="" style="display:block;width:100%;height:100%;object-fit:cover">
            </span>
            <b style="flex:1;min-width:0;font-size:13px">Fragments de core C ×2</b>
            <b class="exq-mono" style="color:#9aa7bd">2 / 100</b>
          </div>
          <div class="bar xp"><i style="width:2%"></i></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="exq-hex" style="color:#ffd166;border-color:#ffd166;background:rgba(255,255,255,.04);padding:0;overflow:hidden">
              <img src="assets/core-shard.webp?v=406" alt="" style="display:block;width:100%;height:100%;object-fit:cover">
            </span>
            <b style="flex:1;min-width:0;font-size:13px">Fragments de core A ×1</b>
            <b class="exq-mono" style="color:#ffd166">1 / 600</b>
          </div>
          <div class="bar xp"><i style="width:1%"></i></div>
        </div>
      </div>
    </div>

    <div class="muted mono" style="font-size:10px">Aperçu statique — même balisage que le butin d'expédition</div>
  </div>
</body>
</html>
