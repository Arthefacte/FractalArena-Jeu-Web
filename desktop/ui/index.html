<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fractal Arena</title>
  <link rel="stylesheet" href="chrome.css">
  <script src="shortcuts.js" defer></script>
  <script src="chrome.js" defer></script>
</head>
<body>
  <header>
    <div id="drag" title="Déplacer la fenêtre · Double-clic pour agrandir"><img class="mark" src="logo.png" alt="" width="22" height="22"> FRACTAL ARENA <span class="edition">PC</span></div>
    <span id="status" role="status"></span>
    <button data-action="reload" title="Recharger le jeu (F5)" aria-label="Recharger le jeu">↻</button>
    <button class="tray" data-action="hide" title="Réduire dans la barre de notification" aria-label="Réduire dans la barre">Réduire dans la barre</button>
    <button data-action="minimize" title="Réduire" aria-label="Réduire">─</button>
    <button id="maximize" data-action="maximize" title="Agrandir / Restaurer" aria-label="Agrandir / Restaurer">□</button>
    <button class="close" data-action="quit" title="Quitter (Ctrl+Q)" aria-label="Quitter">✕</button>
  </header>
</body>
</html>
