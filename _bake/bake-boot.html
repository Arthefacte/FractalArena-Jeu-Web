<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #05070f; }
  #stage { width: 460px; height: 460px; margin: 0 auto; }
</style>
<script type="importmap">
  { "imports": {
      "three": "../vendor/three-0.160.0/three.module.js",
      "three/addons/": "../vendor/three-0.160.0/addons/"
  } }
</script>
</head>
<body>
<div id="stage"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const params = new URLSearchParams(location.search);
// angle réglable via ?ry=..&rx=..&cam=x,y,z pour explorer l'allure de l'emblème
const SIZE = 460;
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(2);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);

// Éclairage « griffe » : lit le métal + rehausse lave/éclairs émissifs.
scene.add(new THREE.HemisphereLight(0xbfe9ff, 0x0a0e18, 0.7));
const key1 = new THREE.DirectionalLight(0xffffff, 2.4); key1.position.set(3, 4, 5); scene.add(key1);
const rim  = new THREE.DirectionalLight(0x66d9ff, 1.6); rim.position.set(-4, 2, -3); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffb066, 0.8); fill.position.set(-2, -3, 2); scene.add(fill);

function normalize(root) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  root.position.sub(center);
  const wrap = new THREE.Group();
  wrap.add(root);
  wrap.scale.setScalar(2 / maxDim);
  return wrap;
}

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
window.__bakeError = null;
window.__baked = false;

loader.load(
  `./raw/boot-emblem.glb`,
  (gltf) => {
    const rawBox = new THREE.Box3().setFromObject(gltf.scene);
    const rs = rawBox.getSize(new THREE.Vector3());
    let meshCount = 0; gltf.scene.traverse((o) => { if (o.isMesh) meshCount++; });
    window.__dbg = { size: [rs.x, rs.y, rs.z].map((n) => +n.toFixed(3)), meshCount };
    const obj = normalize(gltf.scene);
    const dims = [rs.x, rs.y, rs.z];
    const maxDim = Math.max(...dims), minDim = Math.min(...dims);
    const plate = minDim / (maxDim || 1) < 0.4;
    const ry = params.has("ry") ? +params.get("ry") : (plate ? 0 : -0.5);
    const rx = params.has("rx") ? +params.get("rx") : (plate ? 0 : 0.12);
    obj.rotation.set(rx, ry, 0);
    if (params.has("cam")) { const c = params.get("cam").split(",").map(Number); camera.position.set(c[0], c[1], c[2]); }
    else camera.position.set(plate ? 0.6 : 2.0, plate ? 0.4 : 1.3, plate ? 3.6 : 3.2);
    scene.add(obj);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(() => { renderer.render(scene, camera); window.__baked = true; });
  },
  undefined,
  (err) => { window.__bakeError = String(err && err.message || err); window.__baked = true; }
);
</script>
</body>
</html>
