<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style> html,body{margin:0;background:transparent;} #stage{width:300px;height:300px;} </style>
<script type="importmap">
  { "imports": { "three":"../vendor/three-0.160.0/three.module.js", "three/addons/":"../vendor/three-0.160.0/addons/" } }
</script>
</head>
<body>
<div id="stage"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const SIZE=300;
const stage=document.getElementById("stage");
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(SIZE,SIZE); renderer.setPixelRatio(2);
renderer.setClearColor(0x000000,0); renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,0.1,100);
camera.position.set(0.35,0.3,4.4); camera.lookAt(0,0,0);
// éclairage « griffe » (repris du rendu original qui rendait le métal + les émissifs)
scene.add(new THREE.HemisphereLight(0xbfe9ff,0x0a0e18,0.9));
const kL=new THREE.DirectionalLight(0xffffff,2.6); kL.position.set(3,4,5); scene.add(kL);
const rL=new THREE.DirectionalLight(0x66d9ff,1.7); rL.position.set(-4,2,-3); scene.add(rL);
const fL=new THREE.DirectionalLight(0xffb066,0.9); fL.position.set(-2,-3,2); scene.add(fL);
// environnement : reflets doux pour que le métal PBR ne rende pas noir
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const wrap=new THREE.Group(); scene.add(wrap);
const EMIT=2.4;
window.__ready=false; window.__err=null; window.__parts=0;

const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
function loadGLB(url){ return new Promise((res,rej)=>loader.load(url,res,undefined,rej)); }

// normalise un root dans une boîte ~2u ; renvoie {inner, dims}
function normalize(root){
  const box=new THREE.Box3().setFromObject(root);
  const size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z)||1;
  root.position.sub(center);
  const inner=new THREE.Group(); inner.add(root); inner.scale.setScalar(2/maxDim);
  inner.updateWorldMatrix(true,true);
  return { inner, maxDim };
}
// dessine une texture Three dans un canvas → {data,w,h}
function toImageData(tex){
  const img=tex.image; const w=img.width, h=img.height;
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d",{willReadFrequently:true}); ctx.drawImage(img,0,0);
  return { data:ctx.getImageData(0,0,w,h).data, w, h };
}
function sample(id,u,v){
  // UV → pixel (v inversé pour l'espace image)
  let x=Math.floor((u-Math.floor(u))*id.w), y=Math.floor((1-(v-Math.floor(v)))*id.h);
  x=Math.max(0,Math.min(id.w-1,x)); y=Math.max(0,Math.min(id.h-1,y));
  const i=(y*id.w+x)*4;
  return [id.data[i]/255, id.data[i+1]/255, id.data[i+2]/255];
}

const parts=[]; // {mesh, base:Vector3, dir, z, spin, mat}

async function build(){
  // 1) bloc texturé : nuage de points {pos normalisée, base rgb, emit rgb}
  const tg=await loadGLB("./raw/boot-emblem.glb");
  let tMesh=null; tg.scene.traverse(o=>{ if(o.isMesh && !tMesh) tMesh=o; });
  const tNorm=normalize(tg.scene);
  tMesh.updateWorldMatrix(true,true);
  const baseTex=tMesh.material.map, emitTex=tMesh.material.emissiveMap;
  const baseID=baseTex?toImageData(baseTex):null;
  const emitID=emitTex?toImageData(emitTex):null;
  const emitFactor=(tMesh.material.emissive)?[tMesh.material.emissive.r,tMesh.material.emissive.g,tMesh.material.emissive.b]:[1,1,1];
  const pos=tMesh.geometry.attributes.position, uv=tMesh.geometry.attributes.uv;
  const N=pos.count;
  const cloud={ x:new Float32Array(N), y:new Float32Array(N), z:new Float32Array(N),
                br:new Float32Array(N), bg:new Float32Array(N), bb:new Float32Array(N),
                er:new Float32Array(N), eg:new Float32Array(N), eb:new Float32Array(N) };
  const v=new THREE.Vector3();
  let minX=1e9,minY=1e9,minZ=1e9,maxX=-1e9,maxY=-1e9,maxZ=-1e9;
  for(let i=0;i<N;i++){
    v.fromBufferAttribute(pos,i).applyMatrix4(tMesh.matrixWorld);
    cloud.x[i]=v.x; cloud.y[i]=v.y; cloud.z[i]=v.z;
    minX=Math.min(minX,v.x);minY=Math.min(minY,v.y);minZ=Math.min(minZ,v.z);
    maxX=Math.max(maxX,v.x);maxY=Math.max(maxY,v.y);maxZ=Math.max(maxZ,v.z);
    const u=uv.getX(i), w=uv.getY(i);
    const b=baseID?sample(baseID,u,w):[0.5,0.5,0.5];
    const e=emitID?sample(emitID,u,w):[0,0,0];
    cloud.br[i]=b[0];cloud.bg[i]=b[1];cloud.bb[i]=b[2];
    cloud.er[i]=e[0]*emitFactor[0];cloud.eg[i]=e[1]*emitFactor[1];cloud.eb[i]=e[2]*emitFactor[2];
  }
  // 2) grille spatiale (hash voxel)
  const GS=48; // cellules par axe
  const sx=(maxX-minX)||1, sy=(maxY-minY)||1, sz=(maxZ-minZ)||1;
  const cell=Math.max(sx,sy,sz)/GS;
  const grid=new Map();
  const key=(a,b,c)=>a+","+b+","+c;
  const vox=(x,y,z)=>[Math.floor((x-minX)/cell),Math.floor((y-minY)/cell),Math.floor((z-minZ)/cell)];
  for(let i=0;i<N;i++){ const g=vox(cloud.x[i],cloud.y[i],cloud.z[i]); const k=key(g[0],g[1],g[2]); let a=grid.get(k); if(!a){a=[];grid.set(k,a);} a.push(i); }
  function nearest(x,y,z){
    const g=vox(x,y,z); let best=-1,bd=1e18;
    for(let r=0;r<6;r++){
      for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)for(let dz=-r;dz<=r;dz++){
        if(r>0 && Math.max(Math.abs(dx),Math.abs(dy),Math.abs(dz))!==r) continue; // coquille
        const a=grid.get(key(g[0]+dx,g[1]+dy,g[2]+dz)); if(!a) continue;
        for(const i of a){ const ddx=cloud.x[i]-x,ddy=cloud.y[i]-y,ddz=cloud.z[i]-z; const d=ddx*ddx+ddy*ddy+ddz*ddz; if(d<bd){bd=d;best=i;} }
      }
      if(best>=0 && r>=1) break; // trouvé dans un rayon proche
    }
    return best;
  }

  // 3) pièces : transfert de couleur par plus proche voisin
  const pg=await loadGLB("./raw/boot-parts.glb");
  const pNorm=normalize(pg.scene); wrap.add(pNorm.inner);
  const gc=new THREE.Vector3(0,0,0);
  pg.scene.traverse(o=>{
    if(!o.isMesh) return;
    o.updateWorldMatrix(true,true);
    const p=o.geometry.attributes.position, cnt=p.count;
    const aBase=new Float32Array(cnt*3), aEmit=new Float32Array(cnt*3);
    const vv=new THREE.Vector3();
    for(let i=0;i<cnt;i++){
      vv.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);
      const j=nearest(vv.x,vv.y,vv.z);
      if(j>=0){ aBase[i*3]=cloud.br[j];aBase[i*3+1]=cloud.bg[j];aBase[i*3+2]=cloud.bb[j];
                aEmit[i*3]=cloud.er[j];aEmit[i*3+1]=cloud.eg[j];aEmit[i*3+2]=cloud.eb[j]; }
      else { aBase[i*3]=aBase[i*3+1]=aBase[i*3+2]=0.4; }
    }
    // base transférée en vertex color (COLOR_0), convertie sRGB→linéaire pour le pipeline PBR
    const col=new Float32Array(cnt*3);
    for(let i=0;i<cnt*3;i++) col[i]=Math.pow(aBase[i],2.2);
    o.geometry.setAttribute("color",new THREE.BufferAttribute(col,3));
    o.geometry.setAttribute("aEmit",new THREE.BufferAttribute(aEmit,3));
    o.geometry.computeVertexNormals(); // pièces sans normales → calculées pour l'éclairage PBR
    // MeshStandard PBR : métal (base) + lave/éclairs auto-lumineux (aEmit injecté)
    const mat=new THREE.MeshStandardMaterial({ vertexColors:true, metalness:0.75, roughness:0.5,
      transparent:true, side:THREE.DoubleSide });
    mat.onBeforeCompile=(sh)=>{
      sh.uniforms.uEmit={value:EMIT};
      sh.vertexShader="attribute vec3 aEmit;\nvarying vec3 vEmit;\n"+
        sh.vertexShader.replace("void main() {","void main() {\n  vEmit=aEmit;");
      sh.fragmentShader="uniform float uEmit;\nvarying vec3 vEmit;\n"+
        sh.fragmentShader.replace("vec3 totalEmissiveRadiance = emissive;",
          "vec3 totalEmissiveRadiance = emissive + pow(vEmit, vec3(2.2)) * uEmit;");
    };
    o.material=mat;
    // données d'assemblage
    const b=new THREE.Box3().setFromObject(o); const c=b.getCenter(new THREE.Vector3());
    const local=pNorm.inner.worldToLocal(c.clone());
    let dir=local.clone().sub(gc); dir.z*=0.18;
    if(dir.lengthSq()<1e-3){ const a=parts.length*2.399; dir.set(Math.cos(a),Math.sin(a),0); }
    dir.normalize();
    parts.push({ mesh:o, base:o.position.clone(), dir, z:local.z, mat,
      spin:new THREE.Euler((Math.random()-0.5)*1.6,(Math.random()-0.5)*1.6,(Math.random()-0.5)*1.6) });
  });
  parts.sort((a,b)=>a.z-b.z);
  const n=parts.length, dur=0.40, step=(1-dur)/Math.max(1,n-1);
  parts.forEach((p,idx)=>{ p.start=idx*step; p.dur=dur; });
  window.__parts=parts.length;
}

function easeOut(t){return 1-Math.pow(1-t,3);}
function easeInOut(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
window.__setT=function(t){
  const spread=0.85;
  for(const p of parts){
    const lt=Math.max(0,Math.min(1,(t-p.start)/p.dur));
    const eA=easeOut(lt), eR=easeInOut(lt);
    p.mesh.position.copy(p.base).addScaledVector(p.dir, spread*(1-eA));
    p.mesh.rotation.set(p.spin.x*(1-eR),p.spin.y*(1-eR),p.spin.z*(1-eR));
    p.mesh.material.opacity = lt<=0?0:Math.min(1,lt*3);
  }
  wrap.rotation.y=(-0.5)*(1-easeInOut(Math.min(1,t)));
  wrap.rotation.x=0.08;
  renderer.render(scene,camera);
  renderer.getContext().finish();
};

window.__dbg=function(){
  window.__setT(1);
  const box=new THREE.Box3().setFromObject(wrap);
  const s=box.getSize(new THREE.Vector3()), c=box.getCenter(new THREE.Vector3());
  return { wrapChildren:wrap.children.length, parts:parts.length,
    bboxSize:[s.x,s.y,s.z].map(n=>+n.toFixed(3)), bboxCenter:[c.x,c.y,c.z].map(n=>+n.toFixed(3)),
    cam:[camera.position.x,camera.position.y,camera.position.z], part0base: parts[0]?[parts[0].base.x,parts[0].base.y,parts[0].base.z].map(n=>+n.toFixed(3)):null };
};
build().then(()=>{ window.__setT(1); requestAnimationFrame(()=>{ window.__setT(1); window.__ready=true; }); })
       .catch(e=>{ window.__err=String(e&&e.message||e); window.__ready=true; });
</script>
</body>
</html>
