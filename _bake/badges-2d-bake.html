<!doctype html><html><head><meta charset="utf-8">
<title>FA — bake des badges 2D des chips</title>
<!--
  Harnais LOCAL (non commité, comme le reste de _bake/). Sert à regénérer
  assets/fa-badge.webp et assets/fb-badge.webp si les badges 3D changent.
  À servir en http depuis la racine du dépôt :
      python -m http.server 8123 --bind 127.0.0.1
      http://127.0.0.1:8123/_bake/badges-2d-bake.html
  puis : node _bake/capture-badges-2d.mjs <dossier-de-sortie>
  La caméra, les lumières, la pose et le tone mapping sont ceux de ChipBadge
  (app.jsx) : le sprite doit être EXACTEMENT ce que le joueur voyait en 3D.
-->
<script type="importmap">{ "imports": { "three": "../vendor/three-0.160.0/three.module.js", "three/addons/": "../vendor/three-0.160.0/addons/" } }</script>
<style>body{background:#14141c;color:#fff;font:12px monospace;margin:0;padding:8px}canvas{display:block}</style>
</head><body>
<div id="out"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const TAILLE = 256;                 // px du sprite (l'affichage réel est 56 px CSS)
const POSE = [0.1, -0.25, 0];       // pose de repos du badge à l'écran
const loader = new GLTFLoader();
window.__BAKED = {};

async function bake(url, cle) {
  const root = await new Promise((res, rej) => loader.load(url, (g) => res(g.scene), undefined, rej));
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(TAILLE, TAILLE, false);
  renderer.setPixelRatio(1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  document.getElementById("out").appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const box = new THREE.Box3().setFromObject(root);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) / 2;
  const dist = (radius / Math.tan(19 * Math.PI / 180)) * 1.12 + radius;
  const camera = new THREE.PerspectiveCamera(38, 1, Math.max(0.01, radius / 50), radius * 20);
  camera.position.set(0, 0, dist);
  camera.lookAt(center);
  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 3, 4); scene.add(key);
  const back = new THREE.DirectionalLight(0xfff2dd, 1.0); back.position.set(-3, -1, 2); scene.add(back);
  scene.add(new THREE.HemisphereLight(0xfff2dd, 0x2a2a35, 0.7));
  scene.add(new THREE.AmbientLight(0xffffff, 1.05));
  root.position.sub(center);
  root.rotation.set(POSE[0], POSE[1], POSE[2]);
  scene.add(root);
  renderer.render(scene, camera);
  window.__BAKED[cle] = renderer.domElement.toDataURL("image/png");
  renderer.dispose();
}

try {
  await bake("../assets/fa-badge.glb", "fa");
  await bake("../assets/fb-badge.glb", "fb");
} catch (e) {
  window.__BAKED.erreur = String(e && e.message || e);
}
document.body.setAttribute("data-done", String(Object.keys(window.__BAKED).length));
</script></body></html>
