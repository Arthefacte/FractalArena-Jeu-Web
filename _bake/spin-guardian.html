<script type="importmap">

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const SIZE = 384;
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false); renderer.setPixelRatio(1);
renderer.setClearColor(0x0a0f1a, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(0, 0.9, 3.2); camera.lookAt(0, 0, 0);
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(2.5, 3, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x00f0ff, 1.2); rim.position.set(-3, 0, -2); scene.add(rim);
const fill = new THREE.DirectionalLight(0xf7931a, 0.8); fill.position.set(0, -2, 3); scene.add(fill);

let wrap = null;
new GLTFLoader().load("../assets/cores/guardian_core.glb", (g) => {
  const root = g.scene;
  const box = new THREE.Box3().setFromObject(root);
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const max = Math.max(size.x, size.y, size.z) || 1;
  root.position.sub(c);
  wrap = new THREE.Group(); wrap.add(root); wrap.scale.setScalar(2 / max);
  scene.add(wrap);
  renderer.render(scene, camera);
  window.__ready = true;
});
window.setSpin = (a) => { if (wrap) { wrap.rotation.y = a; renderer.render(scene, camera); } };
</script></body></html>
