<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style> html,body{margin:0;background:transparent;} #stage{width:280px;height:280px;} </style>
<script type="importmap">
  { "imports": { "three":"../vendor/three-0.160.0/three.module.js", "three/addons/":"../vendor/three-0.160.0/addons/" } }
</script>
</head>
<body>
<div id="stage"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const SIZE=280;
const stage=document.getElementById("stage");
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(SIZE,SIZE); renderer.setPixelRatio(2);
renderer.setClearColor(0x000000,0); renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.1;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,0.1,100);
camera.position.set(0.5,0.4,4.2); camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xbfe9ff,0x0a0e18,0.8));
const k=new THREE.DirectionalLight(0xffffff,2.4); k.position.set(3,4,5); scene.add(k);
const rim=new THREE.DirectionalLight(0x66d9ff,1.6); rim.position.set(-4,2,-3); scene.add(rim);
const fill=new THREE.DirectionalLight(0xffb066,0.8); fill.position.set(-2,-3,2); scene.add(fill);

const wrap=new THREE.Group(); scene.add(wrap);
const parts=[]; // {mesh, base:Vector3, dir:Vector3, spin:Euler}
window.__ready=false; window.__err=null;

function easeOut(t){ return 1-Math.pow(1-t,3); }
function easeInOut(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

const loader=new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
loader.load("./raw/boot-parts.glb",(gltf)=>{
  const root=gltf.scene;
  // normalise dans une boîte ~2u
  const box=new THREE.Box3().setFromObject(root);
  const size=box.getSize(new THREE.Vector3()), center=box.getCenter(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z)||1;
  root.position.sub(center);
  const inner=new THREE.Group(); inner.add(root); inner.scale.setScalar(2/maxDim);
  wrap.add(inner);

  // collecte les meshes = les 7 pièces ; direction d'éclatement = centre pièce → hors du centre
  wrap.updateWorldMatrix(true,true);
  const gc=new THREE.Vector3(0,0,0);
  let i=0;
  root.traverse((o)=>{
    if(!o.isMesh) return;
    const b=new THREE.Box3().setFromObject(o);
    const c=b.getCenter(new THREE.Vector3());
    const sz=b.getSize(new THREE.Vector3());
    const local=inner.worldToLocal(c.clone());          // centre pièce en espace inner
    let dir=local.clone().sub(gc);
    dir.z*=0.18;                                          // éclatement surtout DANS le plan écran (visible)
    if(dir.lengthSq()<1e-3){ const a=(i*2.399); dir.set(Math.cos(a),Math.sin(a),0); } // pièce centrale : dir latérale
    dir.normalize();
    parts.push({
      mesh:o,
      base:o.position.clone(),
      dir:dir,
      z:local.z,   // profondeur : fond (arrière) → relief (avant) pour l'ordre
      spin:new THREE.Euler((Math.random()-0.5)*1.6,(Math.random()-0.5)*1.6,(Math.random()-0.5)*1.6),
    });
    i++;
  });
  // assemblage SÉQUENTIEL par profondeur : plaque de fond → cadre → monogramme « FA »
  // en relief qui se pose EN DERNIER (climax). Fenêtre [start, start+dur] par pièce.
  parts.sort((a,b)=>a.z-b.z);
  const n=parts.length, dur=0.40, step=(1-dur)/Math.max(1,n-1);
  parts.forEach((p,idx)=>{ p.start=idx*step; p.dur=dur; });
  window.__parts=parts.length;
  window.__setT(0);
  renderer.render(scene,camera);
  requestAnimationFrame(()=>{ renderer.render(scene,camera); window.__ready=true; });
},undefined,(e)=>{ window.__err=String(e&&e.message||e); window.__ready=true; });

// positionne chaque pièce selon SA fenêtre → assemblage séquentiel, puis rend
window.__setT=function(t){
  const spread=0.85;   // éclatement contenu → la pièce reste visible pendant son vol
  for(const p of parts){
    // temps local de la pièce dans sa fenêtre [start, start+dur]
    const lt=Math.max(0,Math.min(1,(t-p.start)/p.dur));
    const eA=easeOut(lt);                       // convergence position
    const eR=easeInOut(lt);                     // résorption rotation
    const off=spread*(1-eA);
    p.mesh.position.copy(p.base).addScaledVector(p.dir,off);
    p.mesh.rotation.set(p.spin.x*(1-eR), p.spin.y*(1-eR), p.spin.z*(1-eR));
    if(p.mesh.material){
      p.mesh.material.transparent=true;
      // invisible tant que la pièce n'est pas entrée en scène ; apparaît vite puis pleine
      p.mesh.material.opacity = lt<=0 ? 0 : Math.min(1, lt*3);
    }
  }
  // pivot global 3/4 → face, terminé quand la dernière pièce se pose
  wrap.rotation.y = (-0.5)*(1-easeInOut(Math.min(1,t)));
  wrap.rotation.x = 0.08;
  renderer.render(scene,camera);
  renderer.getContext().finish(); // flush GPU → buffer prêt pour la capture
};
</script>
</body>
</html>
