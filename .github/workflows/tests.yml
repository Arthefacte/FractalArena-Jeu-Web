name: tests

# CI ajoutée le 22/09/2026 (audit 3e passe) : les ~940 tests ne tournaient qu'en local.
# On NE lance PAS `npm run build` ici, exprès : plusieurs tests comparent les fichiers
# build/*.js et asset-hashes.js aux sources. Un .jsx modifié sans rebuild committé doit
# faire rougir la CI — c'est le garde-fou qui manquait.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # E9 (audit D10/F4) : le test de cache-busting compare le numéro de la branche à celui
      # d'origin/main pour échouer quand un fichier servi change sans bump. Sans cette
      # récupération, le test serait neutre en CI et la garde n'existerait que sur mon poste.
      - run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
