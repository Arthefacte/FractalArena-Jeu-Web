name: tests

# CI ajoutée le 22/09/2026 (audit 3e passe) : les ~940 tests ne tournaient qu'en local.
# On NE lance PAS `npm run build` ici, exprès : plusieurs tests comparent les fichiers
# build/*.js et asset-hashes.js aux sources. Un .jsx modifié sans rebuild committé doit
# faire rougir la CI — c'est le garde-fou qui manquait.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # E9 (audit D10/F4) : le test de cache-busting compare le numéro du commit à celui
          # de son PARENT pour échouer quand un fichier servi change sans bump. Il lui faut
          # donc deux commits d'historique — et surtout PAS de comparaison à `origin/main`,
          # qui exige un ancêtre commun absent d'un clone superficiel (la première version du
          # test échouait sur l'environnement, pas sur un vrai oubli).
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
